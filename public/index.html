<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Make Every Workout Count</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="background: transparent;">

    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop id="myVideo" playsinline preload="metadata">
            <source src="videos/calisthenics.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Navigation -->
    <nav class="landing-nav">
        <div style="font-size: 1.5rem; font-weight: 800; color: var(--secondary);">FITTRACK</div>
        <div>
            <button class="btn-secondary" onclick="toggleAuth()"
                style="width: auto; padding: 10px 24px; margin-right: 10px;">Log In</button>
            <button class="btn-primary" onclick="window.location.href='onboarding.html'"
                style="width: auto; padding: 10px 24px;">Sign Up</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 style="font-size: 4rem; line-height: 1.1; margin-bottom: 24px; color: #fff;">MAKE EVERY <br> <span
                    style="color: var(--primary);">WORKOUT COUNT</span></h1>
            <p style="font-size: 1.2rem; color: #666; margin-bottom: 40px; line-height: 1.6;">Track your runs, log your
                nutrition with AI, and crush your goals. Join the community of 50 million athletes.</p>
            <button class="btn-primary" onclick="window.location.href='onboarding.html'"
                style="font-size: 1.2rem; padding: 20px 40px; width: auto;">Join for Free</button>
        </div>
        <div style="flex: 1; display: flex; justify-content: center;">
            <!-- Placeholder for Hero Image - simulating a phone/runner -->
            <!-- Placeholder Removed -->
            <div style="width: 400px; height: 600px; display: none;"></div>
        </div>
    </section>

    <!-- Auth Overlay (Hidden by default) -->
    <div id="auth-overlay"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div class="auth-box" id="login-form"
            style="background: var(--bg-card); border: 1px solid var(--glass-border); box-shadow: var(--card-shadow);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h1 style="font-size: 2rem; color: var(--secondary);">Log In</h1>
                <span onclick="closeAuth()"
                    style="cursor: pointer; font-size: 1.5rem; color: var(--text-main);">&times;</span>
            </div>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            <p style="margin-top: 15px; text-align: center; color: var(--text-muted);">
                New User? <a href="#" onclick="switchAuth('register')" style="color: var(--primary); font-weight: 700;">Sign Up Here</a> 
                or <a href="onboarding.html" style="color: var(--secondary); font-weight: 600;">Full Guided Setup</a>
            </p>
        </div>

        <div class="auth-box" id="register-form"
            style="display: none; background: var(--bg-card); border: 1px solid var(--glass-border); box-shadow: var(--card-shadow);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h1 style="font-size: 2rem; color: var(--secondary);">Sign Up</h1>
                <span onclick="closeAuth()"
                    style="cursor: pointer; font-size: 1.5rem; color: var(--text-main);">&times;</span>
            </div>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                Already have an account? <a href="#" onclick="switchAuth('login')"
                    style="color: var(--primary); font-weight: 700;">Log In</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function toggleAuth() {
            document.getElementById('auth-overlay').style.display = 'flex';
        }

        function closeAuth() {
            document.getElementById('auth-overlay').style.display = 'none';
        }

        function switchAuth(type) {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            if (type === 'register') {
                login.style.display = 'none';
                register.style.display = 'block';
            } else {
                login.style.display = 'block';
                register.style.display = 'none';
            }
        }
    </script>
</body>

</html>
