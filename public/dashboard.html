<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fitness Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- 1. LEFT SIDEBAR (Navigation) -->
        <div class="sidebar">
            <h2>FitTrack</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="active">Home Feed</a>
                <a href="tracker.html">My Workouts</a>
                <a href="analysis.html">AI Nutrition Scan</a>
                <a href="plans.html">Training Plans</a>
                <!-- Routine link removed -->
                <a href="#" onclick="logout()" style="margin-top: 20px; color: #ff5252;">Logout</a>
            </div>

            <!-- Widget removed -->
        </div>

        <!-- 2. CENTER CONTENT (Activity Feed) -->
        <div class="main-content" style="max-width: 900px; margin: 0 auto; padding-top: 40px;">

            <!-- Welcome Header -->
            <header style="border: none; margin-bottom: 30px; padding: 0; display: flex; align-items: flex-end;">
                <div>
                    <p class="date" id="currentDate">Monday, Oct 24</p>
                    <h1 id="welcomeMsg" style="font-size: 2.2rem; line-height: 1.2;">Hello, <span
                            class="text-gradient">User</span></h1>
                </div>
                <div style="margin-left: auto;">
                    <!-- User Avatar or Profile Link could go here -->
                </div>
            </header>

            <!-- Daily Summary (Hero) -->
            <div class="stats-grid" style="grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 30px;">

                <!-- Main Progress Card -->
                <div class="stat-card"
                    style="text-align: left; position: relative; overflow: hidden; background: linear-gradient(145deg, #1e2024, #14161b);">
                    <div style="position: relative; z-index: 2;">
                        <h3
                            style="font-size: 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px;">
                            <span>🔥 Daily Activity</span>
                            <span id="calorieTargetBadge" style="font-size: 0.75rem; background: rgba(0, 230, 118, 0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-weight: 600;">Custom Goal</span>
                        </h3>

                        <div style="display: flex; gap: 40px;">
                            <div>
                                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px;">Calories</p>
                                <h2 style="font-size: 2rem; color: var(--text-main); margin: 0;"><span
                                        id="caloriesBurned">0</span> <span id="calorieTarget"
                                        style="font-size: 1rem; color: #666;">/
                                        1500 kcal</span></h2>
                                <div
                                    style="width: 150px; height: 6px; background: #333; border-radius: 3px; margin-top: 8px; overflow: hidden;">
                                    <div id="calProgress"
                                        style="width: 0%; height: 100%; background: var(--primary); transition: width 1s ease;">
                                    </div>
                                </div>
                            </div>

                            <div>
                                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px;">Duration</p>
                                <h2 style="font-size: 2rem; color: var(--text-main); margin: 0;"><span
                                        id="workoutDuration">0</span> <span
                                        style="font-size: 1rem; color: #666;">min</span></h2>
                            </div>
                        </div>

                        <!-- Onboarding Input Breakdown Banner -->
                        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.82rem; color: var(--text-muted);">
                            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
                                <div>
                                    <span style="color: #fff; font-weight: 600;">Daily Calorie Target:</span>
                                    <span id="onboardingCalorieGoalText" style="color: var(--primary); font-weight: 700; margin-left: 4px;">-- kcal</span>
                                </div>
                                <span id="onboardingMetricsSummary" style="font-size: 0.75rem; color: #888;">Based on your onboarding inputs</span>
                            </div>
                        </div>
                    </div>
                    <!-- Decorative Circle -->
                    <div
                        style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: var(--primary-glow); filter: blur(60px); opacity: 0.2; border-radius: 50%;">
                    </div>
                </div>

                <!-- Quick Actions Grid -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button class="btn-secondary" onclick="window.location.href='tracker.html'"
                        style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-color: #333; background: var(--bg-card); color: var(--text-main);">
                        <span style="font-size: 1.5rem;">🏋️</span>
                        <span style="font-size: 0.8rem;">Log Workout</span>
                    </button>
                    <button class="btn-secondary" onclick="window.location.href='analysis.html'"
                        style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-color: #333; background: var(--bg-card); color: var(--text-main);">
                        <span style="font-size: 1.5rem;">📸</span>
                        <span style="font-size: 0.8rem;">AI Scan</span>
                    </button>
                    <!-- More buttons can be added here -->
                </div>
            </div>

            <!-- Content Grid: Recent History & Weekly Chart -->
            <div class="charts-section" style="grid-template-columns: 1.5fr 1fr; gap: 24px;">

                <!-- Recent Activity List -->
                <div class="chart-container">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>Recent Activity</h2>
                        <a href="tracker.html"
                            style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">View All</a>
                    </div>
                    <div id="recentActivityList">
                        <p style="color: var(--text-muted)">Loading activity...</p>
                    </div>
                </div>

                <!-- Weekly Goal / Simple Chart -->
                <div class="chart-container">
                    <h2>Weekly Volume</h2>
                    <canvas id="weeklyChart" style="max-height: 200px;"></canvas>
                </div>

            </div>

        </div>

        <!-- Friend Activity & Connect Modal Removed -->

        <!-- Responsive helper script for right sidebar -->
        <style>
            @media (min-width: 1200px) {
                .right-sidebar {
                    display: block !important;
                }
            }
        </style>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check Auth
        if (!localStorage.getItem('token')) window.location.href = 'index.html';

        // Initializer
        document.addEventListener('DOMContentLoaded', loadDashboard);

        // Co-Workout Logic
        // Social functions removed
    </script>
</body>

</html>
