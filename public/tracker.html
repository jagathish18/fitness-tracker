<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker - Fitness Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>FitTrack</h2>
            <div class="nav-links">
                <a href="dashboard.html">Home Feed</a>
                <a href="tracker.html" class="active">My Workouts</a>
                <a href="analysis.html">AI Nutrition Scan</a>
                <a href="plans.html">Training Plans</a>
                <!-- Routine link removed -->
                <a href="#" onclick="logout()" style="margin-top: 20px; color: #ff5252;">Logout</a>
            </div>
        </div>

        <div class="main-content">
            <div class="tracker-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>My Workouts</h1>
                <button class="btn-primary" onclick="openWorkoutModal()">+ Start Empty Workout</button>
            </div>

            <!-- Workout History Feed -->
            <div class="workout-feed" id="workoutFeed">
                <!-- Dynamic Content -->
                <p style="color: var(--text-muted)">Loading history...</p>
            </div>

            <!-- Active Workout Modal -->
            <div id="workoutModal" class="modal"
                style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto;">
                <div class="modal-content"
                    style="background: var(--card-bg); margin: 5% auto; padding: 25px; width: 90%; max-width: 600px; border-radius: 12px; position: relative;">
                    <span class="close" onclick="closeWorkoutModal()"
                        style="position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer;">&times;</span>

                    <h2>Log Workout</h2>
                    <input type="text" id="workoutTitle" placeholder="Workout Title (e.g., Pull Day)"
                        style="width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg-dark); border: 1px solid #333; color: white; border-radius: 6px;">

                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="number" id="workoutDuration" placeholder="Duration (min)"
                            style="flex: 1; padding: 10px; background: var(--bg-dark); border: 1px solid #333; color: white; border-radius: 6px;">
                        <input type="number" id="workoutCalories" placeholder="Calories (~Est)"
                            style="flex: 1; padding: 10px; background: var(--bg-dark); border: 1px solid #333; color: white; border-radius: 6px;">
                    </div>

                    <div id="exerciseList">
                        <!-- Dynamic Exercises will be added here -->
                    </div>

                    <button onclick="addExerciseField()"
                        style="width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 6px; margin: 15px 0; cursor: pointer;">+
                        Add Exercise</button>

                    <button onclick="saveWorkout()" class="btn-primary" style="width: 100%;">Finish Workout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!localStorage.getItem('token')) window.location.href = 'index.html';
    </script>
</body>

</html>
