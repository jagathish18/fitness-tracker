<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Co-Workout - FitTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            overflow: hidden;
            /* Prevent scrolling */
            background: #000;
        }

        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .video-box {
            flex: 1;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Central Overlay */
        .session-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            text-align: center;
            z-index: 100;
            display: flex;
            gap: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-item h3 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0;
            font-family: monospace;
        }

        .stat-item p {
            font-size: 0.8rem;
            margin: 0;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .btn-control {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: white;
            color: black;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-control.end {
            background: #ff5252;
            color: white;
            width: auto;
            border-radius: 30px;
            padding: 0 24px;
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-control:hover {
            transform: scale(1.1);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* Mobile Stack */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }

            .video-box {
                border-bottom: 1px solid #333;
                border-right: none;
            }
        }
    </style>
</head>

<body>

    <!-- Stats Overlay -->
    <div class="session-overlay">
        <div class="stat-item">
            <h3 id="timer">00:00</h3>
            <p>Duration</p>
        </div>
        <div class="stat-item">
            <h3 id="calories">0</h3>
            <p>BPM (Sync)</p>
        </div>
        <div class="stat-item">
            <h3 id="score">0</h3>
            <p>Score</p>
        </div>
    </div>

    <!-- Main Split Layout -->
    <div class="split-container">
        <!-- My Feed (Left/Top) -->
        <div class="video-box">
            <video id="myCamera" autoplay muted playsinline></video>
            <div class="video-label">
                <div class="live-indicator"></div> YOU
            </div>
        </div>

        <!-- Friend Feed (Right/Bottom) -->
        <div class="video-box">
            <!-- Simulated Friend Video -->
            <video id="friendCamera" src="https://videos.pexels.com/video-files/3209172/3209172-hd_1280_720_25fps.mp4"
                autoplay loop muted playsinline></video>
            <div class="video-label">
                <div class="live-indicator"></div> <span id="friendNameDisplay">Connecting...</span>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="control-bar">
        <button class="btn-control">🎤</button>
        <button class="btn-control">📷</button>
        <button class="btn-control end" onclick="endSession()">END SESSION</button>
    </div>

    <script>
        // Get URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const friendName = urlParams.get('friend') || 'Partner';
        document.getElementById('friendNameDisplay').innerText = friendName;

        // Start Webcam
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('myCamera').srcObject = stream;
            } catch (err) {
                console.error("Camera Error:", err);
                alert("Could not access camera. Simulation mode only.");
            }
        }

        // Timer Logic
        let seconds = 0;
        let calories = 70; // Simulated heart rate/calories

        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;

            // Simulate fluctuating BPM/Score
            document.getElementById('calories').innerText = 70 + Math.floor(Math.random() * 40); // 70-110 BPM
            document.getElementById('score').innerText = Math.floor(seconds * 1.5);
        }, 1000);

        function endSession() {
            if (confirm("End workout session?")) {
                window.location.href = 'dashboard.html';
            }
        }

        // Initialize
        startCamera();
    </script>
</body>

</html>
